name: Deploy to Firebase Hosting on main
"on":
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # id-token lets the job prove it is this repository's main branch to Google
    # Cloud, which then lets it act as the deploy service account. No key is
    # stored anywhere.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          persist-credentials: false
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: "22"

      - name: Read the Hugo version
        run: echo "HUGO_VERSION=$(cat .hugo-version)" >> "$GITHUB_ENV"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build
        working-directory: ./src
        run: |
          hugo --minify -d output --baseURL=https://www.paolomainardi.com

      # Workload Identity Federation: the pool only admits
      # paolomainardi/paolomainardi.com on refs/heads/main.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/885649607463/locations/global/workloadIdentityPools/github/providers/paolomainardi-com
          service_account: github-action-587094318@cto-space.iam.gserviceaccount.com

      # Pinned firebase-tools version, see AGENTS.md CI/CD.
      - name: Install the Firebase CLI
        run: npm ci --ignore-scripts --prefix deploy

      - name: Deploy
        run: deploy/node_modules/.bin/firebase deploy --only hosting --project cto-space --non-interactive
