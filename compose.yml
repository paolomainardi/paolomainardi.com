services:
  hugo:
    build:
      context: .
    image: paolomainardi/blog:latest
    environment:
      VIRTUAL_HOST: paolomainardi.loc
      VIRTUAL_PORT: 80
    ports:
      - "8080:80"
    working_dir: /app/src
    # The base URL needs its scheme, and the internal port must not be appended:
    # the proxy terminates TLS on 443, so an emitted //paolomainardi.loc:80 asset
    # URL is fetched as https on port 80 and fails. The livereload socket needs
    # the public port for the same reason.
    command: hugo server --bind 0.0.0.0 --port 80 --theme=hugo-coder --baseURL=https://paolomainardi.loc/ --appendPort=false --liveReloadPort=443 --buildFuture --buildDrafts --buildExpired
    volumes:
      - $PWD:$PWD
      - .:/app
      - ./output:/output
