baseurl = "https://paolomainardi.com"
title = "Paolo Mainardi"
theme = "large-print"
locale = "en"
defaultcontentlanguage = "en"

enableRobotsTXT = true
canonifyurls = true

enableEmoji = true

[pagination]
pagerSize = 20

[services.rss]
limit = 50

[module]
[[module.imports]]
path = "cj.rs/gohugo-asciinema"

[params]
author = "Paolo Mainardi"
info = "Founder and CTO of [@Sparkfabrik](https://www.sparkfabrik.com)"
description = "Paolo Mainardi, founder and CTO of SparkFabrik, writes about containers, Kubernetes, Linux, open source and working with AI coding agents."
# The home page lede; the description above is for search results.
blurb = "Welcome to my personal blog. I'm Paolo Mainardi, Founder and CTO of Sparkfabrik. I write about Containers, Kubernetes, Linux and cloud-native stuff."
jobTitle = "Founder and CTO of SparkFabrik"
avatarurl = "images/me.jpg"
headTitle = "Paolo Mainardi | Founder and CTO of Sparkfabrik"

colorScheme = "auto"

favicon_32 = "/images/favicon-32x32.png"
favicon_16 = "/images/favicon-16x16.png"
touchicon = "/images/apple-touch-icon.png"
manifest = "/site.webmanifest"

footercontent = "Writing about Containers, Kubernetes, Linux and cloud-native stuff"

since = 2022


# Keep this and every other [params.*] table below the plain params keys above:
# a table header ends the [params] table, so any key after it would be nested.

# Optional second segment of the standfirst on the home page. Inline markdown,
# so the link can sit on whichever words should carry it. Unset by default: the
# role is enough.
# [params.twin]
# text = "Twin of [Stefano](https://www.stefanomainardi.com)"

# Umami is the only third party request on the site.
[params.umami]
websiteID = "4930fb12-e01a-46f5-9694-3f6828ac2072"
shareURL = "https://cloud.umami.is/share/njMJ4mXQ6fd6GV9W/www.paolomainardi.com"

# Social links
[[params.social]]
name = "RSS"
icon = "fa fa-rss fa-2x"
weight = 1
url = "https://www.paolomainardi.com/posts/index.xml"
[[params.social]]
name = "Github"
icon = "fa fa-github fa-2x"
weight = 2
url = "https://github.com/paolomainardi"
[[params.social]]
name = "LinkedIn"
icon = "fa fa-linkedin fa-2x"
weight = 5
url = "https://www.linkedin.com/in/paolomainardi/"


# Menu links
[[menu.main]]
name = "Posts"
weight = 1
url = "posts/"
[[menu.main]]
name = "Links"
weight = 2
url = "links/"
[[menu.main]]
name = "Talks"
weight = 3
url = "/talks"
[[menu.main]]
name = "About"
weight = 4
url = "/about"

[markup]
[markup.goldmark.renderer]
unsafe = true
[markup.goldmark.parser]
# A standalone image is not wrapped in a paragraph, so the image render hook can
# emit a figure with a plate number.
wrapStandAloneImageWithinParagraph = false
[markup.highlight]
anchorLineNos = false
codeFences = true
guessSyntax = true
hl_Lines = ''
hl_inline = false
lineAnchors = ''
lineNoStart = 1
lineNos = false
lineNumbersInTable = false
noClasses = false
noHl = false
style = 'dracula'
tabWidth = 4

# Tag and category pages only list posts, so they stay out of the sitemap.
[[cascade]]
[cascade.sitemap]
disable = true
[cascade.target]
kind = "{taxonomy,term}"

# Related posts at the end of each post: shared tags decide, the date only
# breaks ties, and newer posts count too.
[related]
includeNewer = true
threshold = 80
toLower = true
[[related.indices]]
name = "tags"
weight = 100
[[related.indices]]
name = "date"
weight = 10

# Each post is also published as Markdown, for readers who hand it to an LLM.
[outputFormats.markdown]
mediaType = "text/markdown"
baseName = "index"
isPlainText = true
rel = "alternate"

[[cascade]]
outputs = ["html", "markdown"]
[cascade.target]
path = "/posts/**"
kind = "page"
