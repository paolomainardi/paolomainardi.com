# Conference talks, newest first.
#
# Fields
#   title      the talk, without the event name or the language tag
#   event      where it was given
#   location   city, when the event name does not already carry it
#   year       used to group the page, newest first
#   language   EN or IT
#   abstract   optional, hidden behind a disclosure on the page
#   links      label and url pairs, rendered in the order given

talks:
  - title: Building a Trusted and Resilient Software Supply Chain
    event: Cyberwisecon Europe
    year: 2024
    language: EN
    abstract: >-
      The current state of the software supply chain, the significant global
      recent events (SolarWinds, log4shell, codecov), the state of the open source
      ecosystem, the threats and the mitigations that can be applied using tools
      like Sigstore, Syft and Grype for digital signatures, SBOM generation and
      automatic vulnerability scanning, and how to use them to improve integrity
      and to gain unprecedented levels of knowledge of your digital artifacts and
      your cloud infrastructures.
    links:
      - label: Slides
        url: /talks/cyberwisecon-2024-supply-chain.pdf
      - label: Video
        url: https://www.youtube.com/watch?v=8osHp_h9bYU

  - title: What is the secure software supply chain and the current state of the PHP ecosystem
    event: PHPDay
    location: Verona
    year: 2024
    language: IT
    abstract: >-
      What the software supply chain is, common threats and mitigations, and how
      they apply to the IaC ecosystem too. Security threats using Terraform and its
      ecosystem, then OCI images, digital signatures and SBOM using Sigstore and
      Syft. A live coding session deploying secure OCI images on a Kubernetes
      cluster with security policies built with Kyverno, including security
      scanning from the generated SBOM.
    links:
      - label: Slides
        url: /talks/drupalcon-lille-2023-php-supply-chain.pdf
      - label: Code
        url: https://github.com/paolomainardi/sigstore-demo/tree/feature/drupal-demo

