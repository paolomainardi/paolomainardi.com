  - title: Deep dive nella security supply chain della nostra infrastruttura cloud
    event: Incontro DevOps Italia
    year: 2023
    language: IT
    abstract: >-
      L'infrastruttura come codice e le applicazioni cloud-native consentono di
      raggiungere livelli senza precedenti di efficienza e governance dei nostri
      servizi cloud, rendendoci capaci di creare infrastrutture immutabili e
      ripetibili, di poterci operare come se fossero applicazioni quindi
      versionando il codice, qa e test automatici e procedure di rilascio
      automatiche verso gli ambienti di destinazione. Più inseriamo codice nelle
      nostre infrastrutture, più estendiamo la superficie di attacco. In questo
      talk esaminerò gli attacchi alla catena di approvvigionamento a diversi
      livelli, come rilevarli, le tecniche per mitigarli e come scrivere codice IaC
      più sicuro.
    links:
      - label: Slides
        url: /talks/idi2023-supply-chain-iac.pdf
      - label: Code
        url: https://github.com/paolomainardi/idi2023-sigstore-demo

